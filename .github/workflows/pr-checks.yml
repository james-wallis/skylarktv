name: Pull Request Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Ingestor - Linting, TypeScript, Unit Tests
  ingestor:
    name: Ingestor - Lint, TypeScript & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ingestor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: |
          cd ../..
          yarn install --frozen-lockfile

      - name: TypeScript check
        run: yarn tsc

      - name: ESLint check
        run: yarn lint

      - name: Run unit tests
        run: yarn test --ci --coverage --watchAll=false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          file: packages/ingestor/coverage/lcov.info
          flags: ingestor
          name: ingestor-coverage

  # Job 2: SkylarkTV - Linting, TypeScript, Unit Tests
  skylarktv:
    name: SkylarkTV - Lint, TypeScript & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/skylarktv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: |
          cd ../..
          yarn install --frozen-lockfile

      - name: TypeScript check
        run: yarn tsc

      - name: ESLint check
        run: yarn lint

      - name: Run unit tests
        run: yarn test --ci --coverage --watchAll=false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          file: packages/skylarktv/coverage/lcov.info
          flags: skylarktv
          name: skylarktv-coverage

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: SkylarkTV Unit Test Results
          path: packages/skylarktv/reports/jest-junit.xml
          reporter: jest-junit

  # Job 3: Code Quality & Formatting
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prettier check
        run: yarn prettier:check

      - name: Run security audit
        run: yarn audit --level moderate
        continue-on-error: true

  # Job 4: Build Check
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [ingestor, skylarktv]
    defaults:
      run:
        working-directory: packages/skylarktv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: |
          cd ../..
          yarn install --frozen-lockfile

      - name: Build SkylarkTV
        run: yarn build
        env:
          NODE_ENV: production

  # Job 5: Playwright Tests (E2E + Visual Regression)
  playwright:
    name: Playwright Tests - E2E & Visual Regression
    runs-on: ubuntu-latest
    needs: [ingestor, skylarktv]
    defaults:
      run:
        working-directory: packages/skylarktv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: |
          cd ../..
          yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Run all Playwright tests
        run: yarn test:e2e
        env:
          NODE_ENV: test
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/skylarktv/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: packages/skylarktv/test-results/
          retention-days: 30

      - name: Upload screenshot failures
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-diff-images
          path: packages/skylarktv/test-results/**/*-diff.png
          retention-days: 30

  # Job 6: Chromatic (Storybook Visual Testing)
  chromatic:
    name: Chromatic - Storybook Visual Tests
    runs-on: ubuntu-latest
    needs: [skylarktv]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Storybook CSS
        run: yarn prebuild-storybook
        working-directory: packages/skylarktv

      - name: Publish to Chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/skylarktv
          autoAcceptChanges: main
